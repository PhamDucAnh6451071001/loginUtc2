plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'loginUtc2'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext['selenium.version'] = '4.50.0'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.seleniumhq.selenium:selenium-java'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    exclude '**/e2e/**'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('e2eTest', Test) {
    description = 'Runs Selenium tests against the live UTC login website.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/e2e/tests/*Test.class'
    useJUnitPlatform()
    shouldRunAfter tasks.named('test')
    workingDir projectDir
    systemProperty 'file.encoding', 'UTF-8'
    systemProperty 'utc.headless', providers.gradleProperty('headless').getOrElse('false')
    systemProperty 'utc.timeoutSeconds', providers.gradleProperty('timeoutSeconds').getOrElse('15')
    systemProperty 'junit.jupiter.execution.parallel.enabled', 'false'
    outputs.upToDateWhen { false }
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}
