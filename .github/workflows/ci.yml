name: Java and Selenium CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Build and test
        run: bash ./gradlew build --no-daemon --console=plain
      - name: Save unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/*.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Save application JAR
        uses: actions/upload-artifact@v7
        with:
          name: loginUtc2-jar
          path: |
            build/libs/*.jar
            !build/libs/*-plain.jar
          if-no-files-found: error
          retention-days: 14

  selenium:
    name: Selenium against UTC
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Check Chrome
        run: google-chrome --version
      - name: Run Selenium headless
        run: bash ./gradlew e2eTest -Pheadless=true -PtimeoutSeconds=30 --no-daemon --console=plain
      - name: Save Selenium reports and failure screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selenium-reports
          path: |
            build/reports/tests/e2eTest/
            build/test-results/e2eTest/*.xml
            build/screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
